name: Install Turnstile gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-turnstile.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Retail access flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.js')
          s = app.read_text(encoding='utf-8').replace('tplRetailAccess', 'tplRetailAccessV2')
          app.write_text(s, encoding='utf-8')
          page = Path('index.html')
          h = page.read_text(encoding='utf-8')
          tag = '<script src="access-turnstile.js?v=20260914-1" defer></script>'
          if tag not in h:
              h = h.replace('</body>', '  ' + tag + '\n</body>')
          page.write_text(h, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          git diff --cached --quiet || git commit -m "Enable Turnstile on Retail login"
          git push
