name: Restore passwordless Retail CAPTCHA once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-passwordless-captcha-once.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore age then CAPTCHA then shopping mode without password
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js')
          code=app.read_text(encoding='utf-8')
          old_confirm='function confirmRetailAge(){sessionStorage.setItem("tplRetailAge21V1","confirmed");ageGate.hidden=true;unlockSite()}'
          new_confirm='function confirmRetailAge(){sessionStorage.setItem("tplRetailAge21V1","confirmed");ageGate.hidden=true;window.RetailCaptcha?.show?.()}'
          old_restore='if(sessionStorage.getItem("tplRetailAge21V1")==="confirmed"){ageGate.hidden=true;unlockSite()}'
          new_restore='if(sessionStorage.getItem("tplRetailAge21V1")==="confirmed")ageGate.hidden=true;'
          assert code.count(old_confirm)==1 and code.count(old_restore)==1, 'Unexpected Retail age flow; refusing unverified change'
          code=code.replace(old_confirm,new_confirm,1).replace(old_restore,new_restore,1)
          assert 'accessPassword' not in code and 'accessHash' not in code, 'Password handler must stay removed'
          assert code.count('function unlockSite()')==1
          app.write_text(code,encoding='utf-8')

          page=Path('index.html')
          html=page.read_text(encoding='utf-8')
          old_gate='<section id="access-gate" class="access-gate" hidden aria-hidden="true"></section>'
          assert html.count(old_gate)==1 and 'id="access-form"' not in html, 'Password-free gate changed unexpectedly'
          html=html.replace(old_gate,'<section id="access-gate" class="access-gate" hidden aria-hidden="true"></section>',1)
          old_script='  <script src="app.js?v=20260919-1" defer></script>\n'
          new_script='  <script src="app.js?v=20260919-2" defer></script>\n  <script src="retail-captcha.js?v=20260919-1" defer></script>\n'
          assert html.count(old_script)==1 and 'retail-captcha.js' not in html, 'Script injection anchor changed'
          html=html.replace(old_script,new_script,1)
          assert 'id="age-gate"' in html and 'retail-shopping-mode.js' in html and 'Maintenance dosage' in html
          assert 'access-turnstile.js' not in html and 'access-password' not in html
          page.write_text(html,encoding='utf-8')
          PY
          cat > retail-captcha.js <<'JS'
          /*
           * Password-free entry challenge. The original Turnstile sitekey is a
           * Cloudflare TEST key that always passes; this is a visual UX gate,
           * NOT production bot protection or server-validated CAPTCHA.
           */
          (() => {
            'use strict';
            const TEST_SITE_KEY = '1x00000000000000000000AA';
            const ageGate = document.getElementById('age-gate');
            const gate = document.getElementById('access-gate');
            if (!ageGate || !gate) return;
            let captchaPassed = false;
            let widgetRendered = false;
            let scriptRequested = false;
            let renderAttempts = 0;
            gate.setAttribute('role', 'dialog');
            gate.setAttribute('aria-modal', 'true');
            gate.setAttribute('aria-labelledby', 'retail-captcha-title');
            gate.innerHTML = `<div class="access-card">
              <div class="access-mark" aria-hidden="true">P</div>
              <p class="section-label">RETAIL ACCESS</p>
              <h1 id="retail-captcha-title">Quick verification</h1>
              <p>Complete the check below to continue. No password required.</p>
              <div id="retail-captcha-widget" style="display:flex;justify-content:center;min-height:70px;margin:16px 0"></div>
              <button id="retail-captcha-enter" type="button" disabled>Enter Retail</button>
              <p id="retail-captcha-error" class="access-error" role="alert" aria-live="polite"></p>
            </div>`;
            const enter = gate.querySelector('#retail-captcha-enter');
            const error = gate.querySelector('#retail-captcha-error');
            const target = gate.querySelector('#retail-captcha-widget');
            function loadTurnstile() {
              if (window.turnstile || scriptRequested) return;
              scriptRequested = true;
              const script = document.createElement('script');
              script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
              script.async = true;
              script.onerror = () => { error.textContent = 'Verification could not load. Check your connection and refresh.'; };
              document.head.appendChild(script);
            }
            function renderWidget() {
              if (gate.hidden || widgetRendered) return;
              if (!window.turnstile) {
                if (++renderAttempts < 100) setTimeout(renderWidget, 100);
                else error.textContent = 'Verification did not load. Please refresh and try again.';
                return;
              }
              widgetRendered = true;
              try {
                window.turnstile.render(target, {
                  sitekey: TEST_SITE_KEY,
                  theme: 'light',
                  callback: () => { captchaPassed = true; enter.disabled = false; error.textContent = ''; },
                  'expired-callback': () => { captchaPassed = false; enter.disabled = true; error.textContent = 'Verification expired. Please verify again.'; },
                  'error-callback': () => { captchaPassed = false; enter.disabled = true; error.textContent = 'Verification failed. Please refresh and try again.'; }
                });
              } catch (_) { widgetRendered = false; error.textContent = 'Verification could not start. Please refresh and try again.'; }
            }
            function show() {
              if (!ageGate.hidden) return;
              if (sessionStorage.getItem('tplRetailCaptchaV1') === 'completed') {
                unlockSite();
                return;
              }
              gate.hidden = false;
              gate.removeAttribute('aria-hidden');
              loadTurnstile();
              renderWidget();
            }
            enter.addEventListener('click', () => {
              if (!captchaPassed || !ageGate.hidden) return;
              sessionStorage.setItem('tplRetailCaptchaV1', 'completed');
              gate.hidden = true;
              gate.setAttribute('aria-hidden', 'true');
              unlockSite();
            });
            window.RetailCaptcha = Object.freeze({show});
            if (ageGate.hidden) show();
          })();
          JS
          node --check app.js
          node --check retail-captcha.js
          node --check retail-shopping-mode.js
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text()
          html=Path('index.html').read_text()
          captcha=Path('retail-captcha.js').read_text()
          assert 'window.RetailCaptcha?.show?.()' in app
          assert 'retail-captcha.js?v=20260919-1' in html
          assert 'access-turnstile.js' not in html
          assert 'TEST_SITE_KEY' in captcha and 'unlockSite()' in captcha
          print('PASS: age confirmation -> password-free CAPTCHA -> Beginner/Expert; test key explicitly marked non-production')
          PY
          git diff --check
      - name: Commit Retail age and CAPTCHA flow only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html retail-captcha.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Restore password-free Turnstile test CAPTCHA between age and shopping mode'
          git push