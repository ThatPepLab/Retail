name: Remove Retail password gate once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-retail-password-once.yml'
permissions:
  contents: write
jobs:
  remove-password:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove password gate and retain age and shopping mode flows
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          marker = 'const state={products:[]'
          assert s.count(marker) == 1, 'Retail state declaration moved'
          old_header, remainder = s.split(marker, 1)
          assert old_header.count('const accessHash=') == 1, 'Expected original password handler not found'
          assert old_header.count('const ageGate=') == 1, 'Expected original age gate not found'
          header = '''const ageGate=document.querySelector("#age-gate"),ageYes=document.querySelector("#age-yes"),ageNo=document.querySelector("#age-no"),accessGate=document.querySelector("#access-gate");
          function unlockSite(){accessGate.hidden=true;document.body.classList.remove("site-locked")}
          function confirmRetailAge(){sessionStorage.setItem("tplRetailAge21V1","confirmed");ageGate.hidden=true;unlockSite()}
          if(sessionStorage.getItem("tplRetailAge21V1")==="confirmed"){ageGate.hidden=true;unlockSite()}
          ageYes.addEventListener("click",confirmRetailAge);
          ageNo.addEventListener("click",()=>window.location.assign("https://www.google.com/"));

          '''
          s = header + marker + remainder
          assert 'accessPassword' not in s and 'accessDigest' not in s and 'accessHash' not in s
          assert 'function confirmRetailAge()' in s and 'unlockSite()' in s
          p.write_text(s, encoding='utf-8')

          page = Path('index.html')
          h = page.read_text(encoding='utf-8')
          gate_pattern = r'^  <section id="access-gate"[^\n]*</section>\n'
          assert len(re.findall(gate_pattern,h,flags=re.M)) == 1, 'Expected exactly one password panel'
          h = re.sub(gate_pattern, '  <section id="access-gate" class="access-gate" hidden aria-hidden="true"></section>\n', h, count=1, flags=re.M)
          for obsolete in ['  <script src="access-turnstile.js?v=20260916-1" defer></script>\n','  <script src="retail-analytics.js?v=20260916-1" defer></script>\n']:
              assert h.count(obsolete) == 1, 'Missing old password-related script: '+obsolete
              h = h.replace(obsolete, '', 1)
          assert h.count('app.js?v=20260918-2') == 1, 'Unexpected Retail app.js cache version'
          h = h.replace('app.js?v=20260918-2', 'app.js?v=20260919-1', 1)
          assert 'id="age-gate"' in h and 'retail-shopping-mode.js' in h and 'Maintenance dosage' in h
          assert 'id="access-form"' not in h and 'access-password' not in h and 'access-turnstile.js' not in h
          page.write_text(h,encoding='utf-8')
          print('PASS: No password screen/scripts; age confirmation unlocks catalog; shopping mode gate retained')
          PY
          node --check app.js
          node --check retail-shopping-mode.js
          git diff --check
      - name: Commit password-free Retail entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Remove Retail password and CAPTCHA requirement while keeping 21+ and shopping mode'
          git push
