name: Rename Retail maintenance dosage label once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-maintenance-dose-once.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename only the returning dosage label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<strong>Returning user</strong><small>Choose the current dose</small>'
          new = '<strong>Maintenance dosage</strong><small>Choose the current dose</small>'
          assert text.count(old) == 1, 'Expected exactly one returning-user option; refusing unexpected change'
          assert text.count(new) == 0, 'New label already present'
          text = text.replace(old, new, 1)
          assert 'id="protocol-returning"' in text and 'value="returning"' in text
          p.write_text(text, encoding='utf-8')
          print('PASS: Label renamed; returning radio id and value unchanged')
          PY
      - name: Commit only the label update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Rename Returning user dosage to Maintenance dosage in Retail'
          git push
