name: Deploy Retail to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: retail-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Retail
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Pause before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry site deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
